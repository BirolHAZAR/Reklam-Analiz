[phases.install]

cat > nixpacks.toml <<'EOF'
[phases.install]
cmds = [
  "/opt/venv/bin/python -m pip install -r requirements.txt"
]

[start]
cmd = "cd instagram_reklam_analiz && python manage.py migrate --noinput && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p ${PORT:-8000} config.asgi:application"
EOF
