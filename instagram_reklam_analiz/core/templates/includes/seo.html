<meta name="description" content="{{ description }}">
<meta name="robots" content="{{ robots }}">
{% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="ReklamAnaliz.net">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
{% if canonical %}<meta property="og:url" content="{{ canonical }}">{% endif %}
<meta property="og:image" content="{{ image }}">
<meta property="og:image:alt" content="ReklamAnaliz.net logosu">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ image }}">
<meta name="twitter:image:alt" content="ReklamAnaliz.net logosu">
