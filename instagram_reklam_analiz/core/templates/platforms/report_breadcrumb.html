<nav class="ic-breadcrumb" aria-label="Sayfa yolu">
  <a href="{% url 'platform_connections' %}">Platform bağlantıları</a>
  <span aria-hidden="true">/</span>
  {% if campaign %}
    <a href="{% url 'integration_campaigns' account.pk %}?{{ report_query }}">{{ account.display_name }}</a>

    <span aria-current="page">Kampanya performansı</span>
  {% endif %}
</nav>
